[project]
name = "distributed-storage"
version = "0.1.0"
description = "Distributed Storage: zero-knowledge, fault-tolerant distributed file storage (Phase 0 foundation)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36,<2.2",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distributed_storage"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "S", "T20", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["distributed_storage"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast tests with no external services (auto-applied to tests/unit)",
    "integration: tests that need a real PostgreSQL (auto-applied to tests/integration)",
    "fault: fault-injection tests (auto-applied to tests/fault)",
    "slow: tests that take more than a few seconds",
]

[tool.coverage.run]
source = ["distributed_storage"]
branch = true

[tool.coverage.report]
show_missing = true
# No fail_under yet: set a threshold once Phase 1 adds real logic worth gating.
